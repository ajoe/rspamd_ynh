## /etc/rspamd/local.d/rbl.conf
## Names must match block names in modules.d/rbl.conf.
## spamhaus (ZEN), DBL, mailspike, blocklistde and virusfree are enabled by
## default already. SPAMHAUS_ZEN_URIBL is off upstream for privacy reasons
## (it looks up IPs of e-mail addresses found in the message), we enable it.
##
## NOTE: Spamhaus refuses queries coming through public DNS resolvers and
## answers 127.255.255.254 (*_BLOCKED_OPENRESOLVER). Use a local recursive
## resolver (e.g. unbound) for these lists to actually work.

rbls {
    SPAMHAUS_ZEN_URIBL {
        enabled = true;
    }
}
