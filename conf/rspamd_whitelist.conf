# Let mail of the own domains through (e.g. web form mails) if the DKIM
# signature for the domain is valid.
# Cannot be forged: the whitelist module checks the SIGNING domain, not just
# the presence of any valid signature. A stranger setting From: to one of these
# domains and signing with their own domain does not match.
#
# Score -50.0: the highest sum of positive symbols observed in the history was
# 33.20. At -12.0 such a mail would still have reached 21.2 despite a valid
# DKIM signature and been rejected.
rules {
  "WL_OWN_DOMAIN_DKIM" {
    valid_dkim = true;
    domains = [__DKIM_WHITELIST_DOMAINS_LIST__];
    score = -50.0;
  }
}
