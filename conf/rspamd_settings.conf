# Outgoing mail of this server is never classified as spam.
#
# Deliberately NOT matched on the sender domain: the From header is trivially
# forged, and the server's own domains are the most popular forgery target.
# Matched on SMTP AUTH and local submission instead, neither can be forged
# from outside.
#
# The action thresholds are raised instead of using want_spam/whitelist, so all
# modules keep running (outgoing mail stays DKIM signed) and the symbols still
# show up in the history.

outbound_authenticated {
  priority = high;
  authenticated = yes;
  apply {
    actions {
      reject = 9999.0;
      greylist = 9999.0;
      "add header" = 9999.0;   # space, not underscore
    }
  }
}

outbound_local {
  priority = high;
  local = yes;
  apply {
    actions {
      reject = 9999.0;
      greylist = 9999.0;
      "add header" = 9999.0;
    }
  }
}
