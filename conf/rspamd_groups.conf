## /etc/rspamd/local.d/groups.conf
## Score adjustments — applied on top of stock symbols.
## Symbol names checked against rspamd 4.2.1 (conf/scores.d/*_group.conf).

symbols = {
  "R_SPF_FAIL"            { score = 4.0; }   # default 1.0
  "R_DKIM_REJECT"         { score = 3.0; }   # default 1.0
  "DMARC_POLICY_REJECT"   { score = 4.0; }   # default 2.0

  # Missing alignment / no auth at all
  "R_SPF_NEUTRAL"         { score = 1.5; }   # default 0.0
  "R_SPF_SOFTFAIL"        { score = 1.5; }   # default 0.0
  "R_DKIM_NA"             { score = 1.0; }   # default 0.0
  "DMARC_NA"              { score = 1.5; }   # default 0.0

  # MIME structure issues
  "MIME_MA_MISSING_HTML"  { score = 1.5; }   # default 1.0
  "ONCE_RECEIVED"         { score = 0.5; }   # default 0.1

  # Spamhaus ZEN (connecting IP / From). RBL_SPAMHAUS_XBL (4.0), _PBL (2.0),
  # DBL_SPAM (6.5) and DBL_PHISH (7.5) already score high by default.
  "RBL_SPAMHAUS"          { score = 6.0; }   # default 0.0
}
